version: 2
preinstall: true
connections:
  google-workspace: [browser, import]
tools:
  google.collect:
    label: 邮件与日历采集
    advanced: [ maxItems, sourceKey, timeMin, timeMax]
    parameters:
      - {name: connection, label: 我的 Google 连接, connectionType: google-workspace}
      - {name: resource, label: 采集内容, optionLabels: {mail: 邮件, calendar: 日历}}
      - {name: query, label: 邮件范围, description: 使用 Gmail 搜索语法；完整范围分批采集，无需为数量上限缩小范围。}
      - {name: calendarId, label: 日历}
      - {name: pastDays, label: 回看天数}
      - {name: futureDays, label: 未来天数}
      - {name: timeMin, label: 开始时间, description: 可选 ISO 时间；设置后覆盖相对日期范围。}
      - {name: timeMax, label: 结束时间, description: 可选 ISO 时间；设置后覆盖相对日期范围。}
      - {name: maxItems, label: 每批处理条数, description: 每批处理 1–500 条；超过时保存进度，下批继续，不限制总采集量。}
      - {name: sourceKey, label: 来源标识}
  google.gmail.collect:
    hidden: true
    enableWith: google.collect
    parameters:
      - {name: connection, label: 我的 Google 连接, connectionType: google-workspace}
      - {name: directory, label: 保存目录, description: 留空使用所选连接的保存目录；未设置时邮件为 imports/mail，日历为 imports/calendar。}
      - {name: query, label: 邮件查询条件}
      - {name: maxItems, label: 每批处理条数}
      - {name: sourceKey, label: 来源标识}
  google.calendar.collect:
    hidden: true
    enableWith: google.collect
    parameters:
      - {name: connection, label: 我的 Google 连接, connectionType: google-workspace}
      - {name: directory, label: 保存目录, description: 留空使用所选连接的保存目录；未设置时邮件为 imports/mail，日历为 imports/calendar。}
      - {name: calendarId, label: 日历标识}
      - {name: pastDays, label: 回看天数}
      - {name: futureDays, label: 未来天数}
      - {name: maxItems, label: 每批处理条数}
      - {name: sourceKey, label: 来源标识}
